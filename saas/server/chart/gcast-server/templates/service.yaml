apiVersion: v1
kind: Service
metadata:
  name: {{ include "gcast-server.fullname" . }}
  labels:
    {{- include "gcast-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gcast-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
