<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Chromecast Manager{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom -->
  <link rel="stylesheet" href="/static/css/style.css?v={{ static_v }}">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ static_v }}">
</head>
<body class="bg-dark text-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-cast text-danger me-2"></i>Chromecast Manager
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/">
            <i class="bi bi-grid me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'history' %}active{% endif %}" href="/history">
            <i class="bi bi-clock-history me-1"></i>Histórico
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'schedule' %}active{% endif %}" href="/schedule">
            <i class="bi bi-calendar-check me-1"></i>Agendamentos
          </a>
        </li>
      </ul>
      <span class="navbar-text d-flex align-items-center gap-2">
        <span id="notif-badge" class="badge bg-danger d-none">0</span>
        <button class="btn btn-sm btn-outline-secondary" id="btn-notif" title="Notificações">
          <i class="bi bi-bell"></i>
        </button>
      </span>
    </div>
  </div>
</nav>

<!-- Toast container -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" style="z-index: 9999;"></div>

<!-- Notification panel (offcanvas) -->
<div class="offcanvas offcanvas-end text-light bg-dark border-secondary" tabindex="-1" id="notifPanel">
  <div class="offcanvas-header border-bottom border-secondary">
    <h5 class="offcanvas-title"><i class="bi bi-bell me-2"></i>Notificações</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0" id="notif-list">
    <p class="text-muted text-center mt-4">Nenhuma notificação</p>
  </div>
  <div class="offcanvas-footer p-3 border-top border-secondary">
    <button class="btn btn-sm btn-outline-light w-100" id="btn-mark-all-read">Marcar todas como lidas</button>
  </div>
</div>

<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- App JS -->
<script src="/static/js/api.js?v={{ static_v }}"></script>
<script src="/static/js/notifications.js?v={{ static_v }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
