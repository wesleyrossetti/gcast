<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Chromecast Manager{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-cast text-danger me-2"></i>Chromecast Manager
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      {% if user is defined %}
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/"><i class="bi bi-grid me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {% if active == 'agents' %}active{% endif %}" href="/agents"><i class="bi bi-cpu me-1"></i>Agentes</a></li>
        <li class="nav-item"><a class="nav-link {% if active == 'history' %}active{% endif %}" href="/history"><i class="bi bi-clock-history me-1"></i>Histórico</a></li>
      </ul>
      <div class="navbar-text d-flex align-items-center gap-3">
        <span class="text-muted small"><i class="bi bi-building me-1"></i>{{ user.name }}</span>
        <button class="btn btn-sm btn-outline-secondary" id="btn-notif" title="Notificações">
          <i class="bi bi-bell"></i>
          <span id="notif-badge" class="badge bg-danger d-none ms-1">0</span>
        </button>
        <form action="/auth/logout" method="post" class="d-inline">
          <button type="submit" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
          </button>
        </form>
      </div>
      {% endif %}
    </div>
  </div>
</nav>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" style="z-index:9999;"></div>

<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/api.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
