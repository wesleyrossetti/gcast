{% extends "base.html" %}
{% block title %}Histórico – Chromecast Manager{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h2 class="mb-0"><i class="bi bi-clock-history me-2 text-danger"></i>Histórico de Ações</h2>
  <a href="/api/history?limit=200" target="_blank" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-download me-1"></i>Exportar JSON
  </a>
</div>

<div class="card bg-secondary bg-opacity-10 border-secondary mb-3">
  <div class="card-body py-2">
    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Filtrar por Device</label>
        <select class="form-select form-select-sm bg-dark text-light border-secondary" id="filter-device">
          <option value="">Todos os devices</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small text-muted mb-1">Limite</label>
        <select class="form-select form-select-sm bg-dark text-light border-secondary" id="filter-limit">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-sm btn-outline-light w-100" id="btn-filter">
          <i class="bi bi-funnel me-1"></i>Filtrar
        </button>
      </div>
    </div>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-dark table-hover table-sm align-middle">
    <thead class="table-black">
      <tr>
        <th>Horário</th>
        <th>Device</th>
        <th>Ação</th>
        <th>Detalhes</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="history-body">
      <tr><td colspan="5" class="text-center text-muted py-4">Carregando...</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/history.js?v={{ static_v }}"></script>
{% endblock %}
