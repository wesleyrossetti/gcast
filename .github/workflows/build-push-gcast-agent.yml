name: Build and push gcast-agent image

on:
  push:
    branches: [main]
    paths:
      - "saas/agent/**"
      - ".github/workflows/build-push-gcast-agent.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wesleyrossetti/gcast-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (emulação para build multi-arquitetura)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./saas/agent
          push: true
          # O agente roda em Chromecasts/redes locais diversas — cobre amd64 e arm64
          # (Raspberry Pi, etc.)
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
