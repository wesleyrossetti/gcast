{% extends "base.html" %}
{% block title %}Agendamentos – Chromecast Manager{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h2 class="mb-0"><i class="bi bi-calendar-check me-2 text-danger"></i>Agendamentos</h2>
  <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#scheduleModal">
    <i class="bi bi-plus-lg me-1"></i>Novo Agendamento
  </button>
</div>

<div id="schedules-list" class="row g-3">
  <div class="col-12 text-center text-muted py-5">
    <i class="bi bi-calendar-x display-4 d-block mb-3 opacity-25"></i>
    <p>Nenhum agendamento criado.</p>
  </div>
</div>

<!-- Modal novo agendamento -->
<div class="modal fade" id="scheduleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-calendar-plus me-2 text-danger"></i>Novo Agendamento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Device *</label>
          <select class="form-select" id="sched-device-id">
            <option value="">Selecione um device...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Ação *</label>
          <select class="form-select" id="sched-action">
            <option value="play">Play (retomar)</option>
            <option value="pause">Pause</option>
            <option value="stop">Stop</option>
            <option value="volume">Volume</option>
            <option value="mute">Mutar</option>
            <option value="unmute">Desmutar</option>
          </select>
        </div>
        <div class="mb-3" id="sched-volume-group" style="display:none;">
          <label class="form-label">Nível de Volume (0–1)</label>
          <input type="number" step="0.05" min="0" max="1" value="0.5"
                 class="form-control" id="sched-volume-level">
        </div>
        <div class="mb-3">
          <label class="form-label">Data e Hora *</label>
          <input type="datetime-local" class="form-control" id="sched-run-at">
        </div>
        <div class="mb-3">
          <label class="form-label">Recorrência</label>
          <select class="form-select" id="sched-recurrence">
            <option value="once">Uma vez</option>
            <option value="daily">Diário (mesmo horário)</option>
            <option value="weekly">Semanal (mesmo dia/horário)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btn-save-schedule">
          <i class="bi bi-calendar-check me-1"></i>Salvar
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/schedule.js?v={{ static_v }}"></script>
{% endblock %}
