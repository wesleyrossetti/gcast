{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gcast-server.fullname" . }}
  labels:
    {{- include "gcast-server.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    # Se o cluster tiver cert-manager, defina ingress.tls.clusterIssuer em values.yaml
    # e descomente a linha abaixo:
    # cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | default "" | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gcast-server.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
{{- end }}
