<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aceitar Convite – Chromecast Manager</title>
  <script>
  (function () {
    var stored = localStorage.getItem('theme');
    var theme = stored === 'light' || stored === 'dark'
      ? stored
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-bs-theme', theme);
  })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css?v={{ static_v }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
<button class="btn btn-sm btn-outline-secondary position-fixed top-0 end-0 m-3" id="theme-toggle" title="Alternar tema">
  <i class="bi bi-moon-stars-fill" id="theme-toggle-icon"></i>
</button>
<div class="card p-4" style="width:100%;max-width:400px;">
  <div class="text-center mb-4">
    <i class="bi bi-envelope-check text-danger" style="font-size:2.5rem;"></i>
    <h4 class="mt-2 mb-0">Aceitar Convite</h4>
    <small class="text-muted">Complete seu cadastro para continuar</small>
  </div>
  <div id="alert-box" class="d-none alert alert-danger py-2"></div>
  <form id="accept-form">
    <div class="mb-3">
      <label class="form-label">Seu nome</label>
      <input type="text" class="form-control" id="name" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Senha <small class="text-muted">(mín. 8 caracteres)</small></label>
      <input type="password" class="form-control" id="password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-danger w-100">
      <i class="bi bi-check-lg me-1"></i>Concluir cadastro
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/api.js?v={{ static_v }}"></script>
<script>
(function () {
  var icon = document.getElementById('theme-toggle-icon');
  icon.className = document.documentElement.getAttribute('data-bs-theme') === 'dark'
    ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var html = document.documentElement;
    var next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', next);
    localStorage.setItem('theme', next);
    icon.className = next === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
  });
})();

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if (!token) {
  document.getElementById('alert-box').textContent = 'Link de convite inválido — falta o token.';
  document.getElementById('alert-box').classList.remove('d-none');
  document.getElementById('accept-form').classList.add('d-none');
}

document.getElementById('accept-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alert-box');
  box.classList.add('d-none');
  try {
    await apiPost('/auth/accept-invite', {
      token,
      name:     document.getElementById('name').value,
      password: document.getElementById('password').value,
    });
    window.location.href = '/';
  } catch (err) {
    box.textContent = err.message;
    box.classList.remove('d-none');
  }
});
</script>
</body>
</html>
